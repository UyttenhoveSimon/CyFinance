name: Release

# Cuts a release when master gains a minor or major change, read from the commit messages
# since the last v*.*.* tag (Conventional Commits):
#   feat: ...                          -> minor
#   feat!: ... / BREAKING CHANGE: ...  -> major
# fix:, docs:, chore:, Dependabot bumps and the rest never release on their own; they ship
# with the next minor or major. The tag and GitHub release are created here, then the
# publish workflow is dispatched for the tag (a tag pushed with GITHUB_TOKEN would not
# trigger it), so nuget.org trusted publishing still sees publish-nuget.yml.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
      actions: write # dispatch publish-nuget.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v0.0.0)
          range="$last..HEAD"
          [ "$last" = v0.0.0 ] && range=HEAD
          subjects=$(git log --format=%s "$range")
          bodies=$(git log --format=%b "$range")

          bump=none
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
            bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
            bump=minor
          fi

          IFS=. read -r major minor _ <<<"${last#v}"
          case $bump in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v$major.$((minor + 1)).0" ;;
            *) next="" ;;
          esac
          echo "last=$last bump=$bump next=${next:-none}"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Create the tag and GitHub release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LAST: ${{ steps.version.outputs.last }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          range="$LAST..HEAD"
          [ "$LAST" = v0.0.0 ] && range=HEAD
          section() { # $1 = title, $2 = regex on the whole subject
            lines=$(git log --format=%s "$range" | grep -E "$2" | sed -E 's/^[a-z]+(\([^)]*\))?!?: /- /' || true)
            [ -n "$lines" ] && printf '## %s\n\n%s\n\n' "$1" "$lines"
            return 0
          }
          {
            section "Breaking changes" '^[a-z]+(\([^)]*\))?!: '
            section "Features" '^feat(\([^)]*\))?: '
            section "Fixes" '^fix(\([^)]*\))?: '
            section "Performance" '^perf(\([^)]*\))?: '
            echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$LAST...$NEXT"
          } > notes.md
          gh release create "$NEXT" --target "$GITHUB_SHA" --title "$NEXT" --notes-file notes.md

      - name: Publish the package for the new tag
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh workflow run publish-nuget.yml --ref "$NEXT"
