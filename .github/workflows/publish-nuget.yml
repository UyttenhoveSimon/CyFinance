name: Publish NuGet Package

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Run ModularPipelines publish pipeline
        env:
          NUGET_API_KEY: ''
          PIPELINE_MODE: validate
          RUN_LIVE_YAHOO_TESTS: '1'
        run: dotnet run --project pipelines/CyFinance.Pipelines/CyFinance.Pipelines.csproj --configuration Release

      - name: Verify documentation site was generated
        run: |
          test -f artifacts/docs/index.html || { echo "::error::artifacts/docs/index.html missing — the docs site would deploy as a 404."; exit 1; }
          test -f artifacts/docs/api/toc.html || { echo "::error::artifacts/docs/api/toc.html missing — the API reference was not generated."; exit 1; }

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: nuget-packages
          path: artifacts/nuget/*.nupkg

      - name: Upload Docs artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: docs-site
          path: artifacts/docs

  publish:
    # Releases are deliberate: a package goes to nuget.org only when a v*.*.* tag is
    # pushed, so an ordinary commit to master no longer cuts a version of its own.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet artifacts
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v6
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Run ModularPipelines publish pipeline
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          PIPELINE_MODE: publish
          RUN_LIVE_YAHOO_TESTS: '1'
        run: dotnet run --project pipelines/CyFinance.Pipelines/CyFinance.Pipelines.csproj --configuration Release

  deploy-docs:
    # The github-pages environment only accepts the default branch, so a tag push must not
    # try to deploy: master already published these docs on the commit the tag points at.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Docs artifacts
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v6
        with:
          name: docs-site
          path: artifacts/docs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: artifacts/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
